<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Player</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 20px; }
    .card { background: #1e1e1e; padding: 25px; border-radius: 12px; text-align: center; width: 100%; max-width: 320px; }
    input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: none; box-sizing: border-box; }
    button { background: #1db954; color: white; border: none; padding: 10px; width: 100%; border-radius: 20px; font-weight: bold; }
    audio { width: 100%; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Audio Player</h2>
    <input type="text" id="streamUrl" placeholder="Incolla URL audio qui">
    <button onclick="playAudio()">Riproduci</button>
    <audio id="audioPlayer" controls></audio>
  </div>
  <script>
    // SOSTITUISCI IL LINK QUI SOTTO CON IL TUO LINK DI RENDER (Mantenendo le virgolette)
    const BACKEND_URL = "https://audio-backend-qwst.onrender.com";

    function playAudio() {
      const url = document.getElementById('streamUrl').value;
      if (!url) return alert('Inserisci un URL valido');
      document.getElementById('audioPlayer').src = `${BACKEND_URL}/api/stream?url=${encodeURIComponent(url)}`;
      document.getElementById('audioPlayer').play();
    }
  </script>
</body>
</html>
